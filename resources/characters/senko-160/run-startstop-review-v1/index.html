<script>
'use strict';
const data=JSON.parse(document.getElementById('manifest').textContent);
const byId=id=>document.getElementById(id), select=byId('clip'),play=byId('play'),scrub=byId('scrub'),status=byId('status');
const stage=byId('stage'),ctx=stage.getContext('2d'),images=new Map();
ctx.imageSmoothingEnabled=false;
let clock=0,distance=0,index=0,playing=false,last=null,ready=false,presentations=0;
for(const [i,c] of data.clips.entries()){const option=document.createElement('option');option.value=i;option.textContent=c.name;select.append(option);}
const current=()=>data.clips[Number(select.value)];

}
function configure(){clock=0;distance=0;index=0;last=null;scrub.max=current().frames.length-1;byId('speed').disabled=current().stride<=0;draw();}
select.onchange=configure;
play.onclick=()=>{playing=!playing;last=null;play.textContent=playing?'Tạm dừng':'Phát';};
byId('reset').onclick=configure;
scrub.oninput=()=>{playing=false;play.textContent='Phát';index=Number(scrub.value);const c=current();clock=c.delays.slice(0,index).reduce((a,b)=>a+b,0);distance=c.stride>0?index*c.stride:0;last=null;draw();};
byId('mirror').onchange=draw;byId('points').onchange=draw;
function tick(now){if(last===null)last=now;const dt=now-last;last=now;
 if(ready&&playing){const c=current();clock+=dt;if(c.stride>0){const speed=Number(byId('speed').value);distance+=dt*Math.max(0,Math.min(2400,Number.isFinite(speed)?speed:0))/1000;index=Math.floor(distance/c.stride)%c.frames.length;}else{let t=c.loop?clock%c.duration:Math.min(clock,c.duration-1);index=0;while(index<c.delays.length-1&&t>=c.delays[index]){t-=c.delays[index++];}if(!c.loop&&clock>=c.duration){playing=false;play.textContent='Phát';}}presentations++;draw();}requestAnimationFrame(tick);}
const sources=[...new Set(data.clips.flatMap(c=>c.frames.map(f=>f.image)))];
Promise.all(sources.map(src=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images.set(src,im);resolve();};im.onerror=()=>reject(new Error(`Không nạp được ${src}`));im.src=src;}))).then(()=>{ready=true;play.disabled=false;configure();requestAnimationFrame(tick);}).catch(error=>{status.textContent=error.message;});
</script></html>
